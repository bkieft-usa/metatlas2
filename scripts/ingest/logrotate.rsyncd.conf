# Rotation for the dtn04 rsync daemon log (see rsyncd.dtn04.nersc.gov.conf).
# Run from msdata's Perlmutter scrontab (job rotate_rsyncd_logs). The daemon keeps
# the log open, so it is copied and truncated in place (copytruncate) rather than
# renamed; rsync appends, so writing continues normally after truncation.
/global/cfs/cdirs/m2650/rsyncd/logs/*.log {
    daily
    rotate 10
    size 10M
    nocompress
    copytruncate
    missingok
    notifempty
}
