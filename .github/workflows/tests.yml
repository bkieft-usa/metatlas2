name: Tests

# Run on every push to any branch EXCEPT main (direct pushes to main are
# blocked by branch-protection rules anyway), and on every pull-request
# that targets main.  This means:
#
#   • Push to dev / feature branches  → unit tests run immediately
#   • Open / update a PR → main       → unit + system tests must pass
#                                        before the PR can be merged
#
# The "system-tests" job is gated behind "unit-tests" so a fast unit
# failure doesn't waste time spinning up the heavier system suite.

on:
  push:
    branches-ignore:
      - main          # direct pushes to main are blocked; PRs handle it
  pull_request:
    branches:
      - main          # any PR targeting main triggers both test suites

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # 1. Unit tests — fast, no Docker, run on every push to every branch
  # ──────────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install project + test dependencies
        run: uv pip install --system -e ".[test]"

      - name: Run unit tests
        run: |
          pytest tests/ \
            -m "not system" \
            --tb=short \
            -q \
            --junitxml=unit-test-results.xml

      - name: Upload unit-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: unit-test-results.xml
          retention-days: 14

  # ──────────────────────────────────────────────────────────────────────
  # 2. System tests — heavier, only on PRs targeting main
  #    Requires unit tests to pass first.
  # ──────────────────────────────────────────────────────────────────────
  system-tests:
    name: System tests
    runs-on: ubuntu-latest
    needs: unit-tests
    # Only run on pull-requests that target main, not on plain branch pushes
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install project + test dependencies
        run: uv pip install --system -e ".[test]"

      - name: Run system tests
        run: |
          pytest tests/test_system.py \
            -m "system" \
            --tb=short \
            -q \
            --junitxml=system-test-results.xml

      - name: Upload system-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-test-results
          path: system-test-results.xml
          retention-days: 14

      - name: Upload system-test tmp outputs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: system-test-tmp-outputs
          path: /tmp/pytest-*/
          retention-days: 7
          if-no-files-found: warn
